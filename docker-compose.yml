version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 3s
      retries: 5

  stats-api:
    build: ./services/stats-api
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/stats"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - color-api
      - stats-api
      - health-api

  frontend:
    build: ./services/frontend

  color-api:
    build: ./services/color-api
    environment:
      - FLASK_APP=app.py
    depends_on:
      - redis

  health-api:
    build: ./services/health-api
    environment:
    - DB_URL=${DATABASE_URL}
    depends_on:
      - color-api
      - stats-api
      - db

  redis:
    image: redis:alpine

volumes:
  postgres_data: