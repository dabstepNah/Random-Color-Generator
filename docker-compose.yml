version: '3.8'

x-logging-default: &logging-default
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    cpus: '0.5'
    restart: unless-stopped
    <<: *logging-default

  stats-api:
    build: ./services/stats-api
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/stats"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 256m
    cpus: '0.5'
    restart: unless-stopped
    <<: *logging-default

  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - color-api
      - stats-api
      - health-api
    mem_limit: 128m
    cpus: '0.3'
    restart: unless-stopped
    <<: *logging-default

  frontend:
    build: ./services/frontend
    mem_limit: 64m
    cpus: '0.2'
    restart: unless-stopped
    <<: *logging-default

  color-api:
    build: ./services/color-api
    environment:
      - FLASK_APP=app.py
    depends_on:
      - redis
    mem_limit: 256m
    cpus: '0.5'
    restart: unless-stopped
    <<: *logging-default

  health-api:
    build: ./services/health-api
    environment:
      - DB_URL=${DATABASE_URL}
    depends_on:
      - color-api
      - stats-api
      - db
    mem_limit: 128m
    cpus: '0.3'
    restart: unless-stopped
    <<: *logging-default

  redis:
    image: redis:alpine
    mem_limit: 128m
    cpus: '0.3'
    restart: unless-stopped
    <<: *logging-default

volumes:
  postgres_data: